# Merge these sections into the existing QX configuration; this is not a full profile.
# Push BOTH rebuilt scripts to CodeCraft39/sgmodule master before loading.
# debug=true enables device-test logs. Remove the fragment for normal use.
# Replace overlapping response and initplayback/log_event request rules.
[rewrite_local]
# Use the rebuilt response script. ad_break is observed and passed unchanged.
^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player(?:/ad_break)?|search|reel/reel_watch_sequence|guide|account/get_setting|get_watch|log_event|config)(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/CodeCraft39/sgmodule/master/Script/Youtube/youtube.response.js#debug=true
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback\?(?:[^#]*&)?ack(?:=|&|$) url script-analyze-echo-response https://raw.githubusercontent.com/CodeCraft39/sgmodule/master/Script/Youtube/youtube.request.js#debug=true
# Header-only: preserve Content-Encoding/Content-Length and forward the body untouched.
^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/log_event(?:\?.*)?$ url script-request-header https://raw.githubusercontent.com/CodeCraft39/sgmodule/master/Script/Youtube/youtube.request.js#debug=true

[mitm]
# Add these hosts to the existing hostname list; do not replace other hosts.
hostname = *.googlevideo.com, youtubei.googleapis.com
