# QX request-stage local playback candidate, build 20261101.6.
# Replace overlapping YouTube/probe rules; retain unrelated rules and MITM hosts.
# No initplayback response-body rule: the request-stage adapter owns its response.
[rewrite_local]
^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player(?:/ad_break)?|search|reel/reel_watch_sequence|guide|account/get_setting|get_watch|log_event|config)(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/CodeCraft39/sgmodule/master/Script/Youtube/youtube.response.js#debug=true&localPlayback=true
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback\?(?:[^#]*&)?ack(?:=|&|$) url script-analyze-echo-response https://raw.githubusercontent.com/CodeCraft39/sgmodule/master/Script/Youtube/youtube.request.js#debug=true&localPlayback=true&qxEcho=true
^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/log_event(?:\?.*)?$ url script-request-header https://raw.githubusercontent.com/CodeCraft39/sgmodule/master/Script/Youtube/youtube.request.js#debug=true&localPlayback=true
^https:\/\/example\.com\/yt-local-capture\/(export|prepare-bootstrap)(?:\?.*)?$ url script-echo-response https://raw.githubusercontent.com/CodeCraft39/sgmodule/master/tools/youtube-device/capture.js

[mitm]
hostname = *.googlevideo.com, youtubei.googleapis.com, example.com
