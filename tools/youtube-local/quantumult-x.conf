# Opt-in local playback test. Replace overlapping YouTube request/response rules.
# Publish BOTH rebuilt scripts. Keep unrelated rules and MITM hosts.
# All initplayback processing stays on device; local errors pass the original response through.
[rewrite_local]
^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player(?:/ad_break)?|search|reel/reel_watch_sequence|guide|account/get_setting|get_watch|log_event|config)(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/CodeCraft39/sgmodule/master/Script/Youtube/youtube.response.js#debug=true&localPlayback=true
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback\?(?:[^#]*&)?ack(?:=|&|$) url script-request-body https://raw.githubusercontent.com/CodeCraft39/sgmodule/master/Script/Youtube/youtube.request.js#debug=true&localPlayback=true
^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/log_event(?:\?.*)?$ url script-request-header https://raw.githubusercontent.com/CodeCraft39/sgmodule/master/Script/Youtube/youtube.request.js#debug=true&localPlayback=true
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback\?(?:[^#]*&)?ack(?:=|&|$) url script-response-body https://raw.githubusercontent.com/CodeCraft39/sgmodule/master/Script/Youtube/youtube.response.js#debug=true&localPlayback=true

[mitm]
# Merge these hosts with the existing list.
hostname = *.googlevideo.com, youtubei.googleapis.com
